<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      textarea { width: 100%; height: 80px; font-family: monospace; }
      button { margin-top: 10px; padding: 6px 12px; }
      pre { background: #f7f7f7; padding: 10px; white-space: pre-wrap; }
      .error { color: red; }
    </style>
  </head>
  <body>
    <h2>Sheet SQL-like Query</h2>
    <p>Examples:</p>
    <pre>
SELECT * FROM sku;
SELECT * FROM sku WHERE sku_code = 'TBAMET10';
SELECT * FROM sku WHERE price BETWEEN 10 AND 100 AND weight &lt; 2;
SELECT * FROM sku WHERE sku_code IN ('TBAMET10','TBAMET28');
    </pre>
    <p> Note: table name is product_list </p>

    <textarea id="queryBox" placeholder="Type your SQL-like query here"></textarea><br>
    <button onclick="run()">Run Query</button>

    <h3>Result</h3>
    <div id="result"></div>

    <script>
      function run() {
        var q = document.getElementById('queryBox').value;
        var resultDiv = document.getElementById('result');
        resultDiv.innerHTML = 'Running...';

        google.script.run
          .withSuccessHandler(function(res) {
            if (res.error) {
              resultDiv.innerHTML = '<p class="error">' + res.error + '</p>';
              return;
            }
            var pretty = JSON.stringify(res, null, 2);
            resultDiv.innerHTML = '<pre>' + pretty + '</pre>';
          })
          .withFailureHandler(function(err) {
            resultDiv.innerHTML = '<p class="error">Error: ' + err.message + '</p>';
          })
          .runQuery(q);
      }
    </script>
  </body>
</html>
